<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy New Year Fireworks</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
    }

    /* CENTER CONTENT */
    .center-box {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      text-align: center;
      padding: 16px;
      z-index: 10;
      pointer-events: none;
    }

    h1 {
      color: white;
      font-size: clamp(24px, 6vw, 42px);
      margin: 0;
    }

    button {
      pointer-events: auto;
      padding: 14px 18px;
      font-size: clamp(16px, 4vw, 20px);
      background: blueviolet;
      color: white;
      border: none;
      border-radius: 14px;
      width: 100%;
      max-width: 280px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.95);
      opacity: 0.7;
    }

    img {
      width: 100%;
      max-width: 260px;
      border-radius: 14px;
    }

    p {
      color: white;
      font-size: clamp(18px, 4.5vw, 26px);
      margin: 4px 0 0;
    }
  </style>
</head>

<body>

  <div class="center-box" id="content">
    <h1>🎉 Happy New Year 🎉</h1>
    <button onclick="handleclick()">Do NOT click for Gift 🎁</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    /* ---------- GIFT CLICK ---------- */
    function handleclick() {
      const box = document.getElementById("content");

      if (document.getElementById("gift-img")) return;

      const img = document.createElement("img");
      img.id = "gift-img";
      img.src =
        "https://www.meme-arsenal.com/memes/2a2bcc97bb6031933649638bebcfe75a.jpg";

      const p = document.createElement("p");
      p.innerText = "Paise nhi h bhai... 😂💸 tu he dede gift";

      box.append(img, p);
    }

    /* ---------- CANVAS SETUP ---------- */
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 2 + 1;
        this.color = `hsl(${Math.random() * 360},100%,60%)`;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.life = 90;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    let particles = [];

    function firecracker(x, y) {
      for (let i = 0; i < 70; i++) {
        particles.push(new Particle(x, y));
      }
    }

    function animate() {
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
      });

      requestAnimationFrame(animate);
    }

    /* TOUCH + CLICK SUPPORT */
    canvas.addEventListener("click", e => {
      firecracker(e.clientX, e.clientY);
    });

    canvas.addEventListener("touchstart", e => {
      const touch = e.touches[0];
      firecracker(touch.clientX, touch.clientY);
    });

    setInterval(() => {
      firecracker(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.4
      );
    }, 1000);

    animate();
  </script>

</body>
</html>
